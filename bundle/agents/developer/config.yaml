spec_version: 1
name: developer
description: An ordinary native CLI agent receiving one bounded development task.
executor:
  type: omnigent
  model: gpt-6-sol
  reasoning_effort: high
  config:
    harness: codex-native
prompt: |
  Carry out the assigned development task using the repository's instructions.
  Use the explicit assigned project path for commands and edits; the inherited
  working directory may only hold coordination notes. Follow the task's scope
  and authorization. Local development does not itself authorize deployment,
  push, production writes, external communications or machine-wide changes.
  Do not contact/spawn other agents. Write handoffs at the supplied path.
  Return your result to the
  caller. Keep the final handoff short: change, exact commit, checks, unresolved
  issues, and a path to detailed evidence when needed. Use English for files
  and the handoff. You receive follow-ups through the same caller.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
